<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login - Annavaram Web</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <div class="login-page">

        <div class="login-box">

            <p class="section-title">
                ANNAVARAM WEB
            </p>

            <h1>
                Admin Login
            </h1>

            <p class="login-text">
                Login to manage your videos and images.
            </p>

            <form id="loginForm">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter email"
                    autocomplete="email"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="submit"
                    class="login-btn"
                    id="loginBtn"
                >
                    Login
                </button>

                <p
                    id="loginMessage"
                    role="alert"
                ></p>

            </form>

            <a
                href="/"
                class="back-link"
            >
                ← Back to Website
            </a>

        </div>

    </div>

    <script>

        const loginForm =
            document.getElementById("loginForm");

        const loginBtn =
            document.getElementById("loginBtn");

        const loginMessage =
            document.getElementById("loginMessage");


        loginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value;

                loginMessage.textContent = "";

                loginBtn.disabled = true;
                loginBtn.textContent = "Logging in...";


                try {

                    const response =
                        await fetch("/api/login", {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                email: email,
                                password: password
                            })
                        });


                    const data =
                        await response.json();


                    if (response.ok && data.success) {

                        sessionStorage.setItem(
                            "adminLoggedIn",
                            "true"
                        );

                        sessionStorage.setItem(
                            "adminEmail",
                            email
                        );

                        window.location.href =
                            "/dashboard.html";

                        return;
                    }


                    loginMessage.textContent =
                        data.message ||
                        "Invalid email or password";


                } catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );

                    loginMessage.textContent =
                        "Server connection failed. Please try again.";

                } finally {

                    loginBtn.disabled = false;
                    loginBtn.textContent = "Login";

                }

            }
        );

    </script>

</body>

</html>
